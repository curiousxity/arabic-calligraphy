name: Deploy

# Push to main builds and publishes to Cloudflare. The unit suite gates the
# deploy; the Playwright e2e suite does not, since it needs browsers installed
# and is run locally with `npm run e2e`.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight deploy rather than racing it.
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
